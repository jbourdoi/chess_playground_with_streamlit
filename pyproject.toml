[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-streamlit"
version = "0.1.0"
description = "Chess game built with Streamlit using an MVC-inspired architecture"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.64.0",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_generics = true
check_untyped_defs = true
ignore_missing_imports = true
